<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Goose 🪿</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0E0A1F;
      color: #E9E1FF;
      font-family: "Press Start 2P", monospace;
    }
    h1 { color: #FFD23F; font-size: 22px; margin: 0; }
    canvas {
      max-width: 95vw;
      border: 4px solid #3BE8FF;
      border-radius: 12px;
      box-shadow: 8px 8px 0 #FF4FA3;
      cursor: pointer;
    }
    p { font-size: 10px; color: #B9AEDB; }
  </style>
</head>
<body>
  <h1>🪿 SPACE GOOSE</h1>
  <canvas id="game" width="800" height="400"></canvas>
  <p>SPACE / CLICK = JUMP · De Anza Game Dev Club</p>
  <script src="game.js"></script>
</body>
</html>
